<style>
  :root {
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 300;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background-color 400ms var(--ease), color 400ms var(--ease);
    overflow-x: hidden;
  }

  /* ── DARK · ESSENCE ───────────────────────── */
  body[data-theme="dark"] {
    --bg: #0E0E0C;
    --bg-soft: #1A1A18;
    --text: #ECE6D6;
    --text-dim: rgba(236, 230, 214, 0.72);
    --text-faint: rgba(236, 230, 214, 0.40);
    --accent: #B8A36A;
    --accent-soft: rgba(184, 163, 106, 0.38);
    --hairline: rgba(236, 230, 214, 0.16);
    --hairline-strong: rgba(236, 230, 214, 0.32);
    --img-filter: brightness(0.82) contrast(1.06) saturate(0.85);
    --overlay-hero: linear-gradient(180deg, rgba(14,14,12,0.35) 0%, rgba(14,14,12,0.78) 65%, rgba(14,14,12,0.92) 100%);
    --overlay-cta:  linear-gradient(180deg, rgba(14,14,12,0.72) 0%, rgba(14,14,12,0.88) 100%);
    --overlay-cinematic: linear-gradient(180deg, rgba(14,14,12,0.18) 0%, rgba(14,14,12,0.50) 100%);
    --overlay-hero-side: linear-gradient(90deg, rgba(14,14,12,0.85) 0%, rgba(14,14,12,0.45) 55%, rgba(14,14,12,0) 100%);
  }
  /* ── LIGHT · CEREMONY ─────────────────────── */
  body[data-theme="light"] {
    --bg: #F4EFE0;
    --bg-soft: #EEE8D6;
    --text: #3A3017;
    --text-dim: rgba(58, 48, 23, 0.78);
    --text-faint: rgba(58, 48, 23, 0.50);
    --accent: #6F5F33;
    --accent-soft: rgba(111, 95, 51, 0.32);
    --champagne: #B8A874;
    --hairline: rgba(58, 48, 23, 0.20);
    --hairline-strong: rgba(58, 48, 23, 0.36);
    --img-filter: brightness(1.0) contrast(0.96) saturate(0.9) sepia(0.06);
    --overlay-hero: linear-gradient(180deg, rgba(244,239,224,0.45) 0%, rgba(244,239,224,0.92) 100%);
    --overlay-cta:  linear-gradient(180deg, rgba(244,239,224,0.62) 0%, rgba(244,239,224,0.88) 100%);
    --overlay-cinematic: linear-gradient(180deg, rgba(244,239,224,0.12) 0%, rgba(244,239,224,0.32) 100%);
    --overlay-hero-side: linear-gradient(90deg, rgba(244,239,224,0.85) 0%, rgba(244,239,224,0.40) 55%, rgba(244,239,224,0) 100%);
  }

  /* The microframe around the page (brandbook gesture) */
  .micro-frame {
    position: fixed; inset: 14px;
    pointer-events: none; z-index: 60;
    border: 1px solid var(--hairline);
  }
  .micro-frame::before, .micro-frame::after,
  .micro-frame > i::before, .micro-frame > i::after {
    content: ""; position: absolute; width: 16px; height: 16px;
    border-color: var(--accent); border-style: solid; border-width: 0;
  }
  .micro-frame::before { top: -1px; left: -1px; border-top-width: 1px; border-left-width: 1px; }
  .micro-frame::after  { top: -1px; right: -1px; border-top-width: 1px; border-right-width: 1px; }
  .micro-frame > i::before { bottom: -1px; left: -1px; border-bottom-width: 1px; border-left-width: 1px; position: absolute; width:16px; height:16px; content:""; }
  .micro-frame > i::after  { bottom: -1px; right: -1px; border-bottom-width: 1px; border-right-width: 1px; position: absolute; width:16px; height:16px; content:""; }

  /* Typographic primitives */
  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .eyebrow-dim {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .caption {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .body-lg { font-size: 18px; line-height: 1.65; font-weight: 300; color: var(--text-dim); max-width: 62ch; }
  .body-md { font-size: 16px; line-height: 1.7; font-weight: 300; color: var(--text-dim); max-width: 62ch; }
  .body-sm { font-size: 14px; line-height: 1.6; font-weight: 300; color: var(--text-dim); }

  /* Headlines */
  .h-hero {
    font-weight: 200;
    letter-spacing: -0.015em;
    line-height: 1.02;
    font-size: clamp(48px, 8.4vw, 104px);
    color: var(--text);
    margin: 0;
  }
  .h-display {
    font-weight: 200;
    letter-spacing: -0.01em;
    line-height: 1.08;
    font-size: clamp(40px, 5.4vw, 64px);
    color: var(--text);
    margin: 0;
    text-wrap: pretty;
  }
  .h-section {
    font-weight: 200;
    letter-spacing: -0.008em;
    line-height: 1.12;
    font-size: clamp(34px, 4vw, 52px);
    color: var(--text);
    margin: 0;
    text-wrap: balance;
  }

  /* Theme-specific italic accents */
  body[data-theme="light"] em.accent {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
    letter-spacing: -0.01em;
  }
  body[data-theme="light"] .h-hero,
  body[data-theme="light"] .h-display,
  body[data-theme="light"] .h-section {
    /* Light keeps Inter for body, but big heads gain Cormorant when marked .serif */
  }
  body[data-theme="light"] .serif {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    letter-spacing: -0.015em;
  }
  body[data-theme="light"] .serif-italic {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    letter-spacing: -0.01em;
  }

  body[data-theme="dark"] em.accent {
    font-family: 'Inter', sans-serif;
    font-style: normal;
    font-weight: 100;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  body[data-theme="dark"] .serif,
  body[data-theme="dark"] .serif-italic { font-family: 'Inter', sans-serif; font-weight: 200; font-style: normal; }

  /* Links */
  .cta-link {
    display: inline-flex; align-items: baseline; gap: 10px;
    font-family: 'Inter', sans-serif; font-weight: 400; font-size: 12px;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--text); text-decoration: none;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--accent);
    transition: color 200ms var(--ease), border-color 200ms var(--ease);
    cursor: pointer;
  }
  .cta-link .arrow { transition: transform 250ms var(--ease); color: var(--accent); }
  .cta-link:hover .arrow { transform: translateX(6px); }
  .cta-link:hover { color: var(--accent); }

  .cta-link.subtle {
    font-size: 13px; letter-spacing: 0.02em; text-transform: none;
    font-weight: 300; border-bottom-color: var(--hairline-strong);
  }
  .cta-link.subtle:hover { border-bottom-color: var(--accent); }

  /* Hairline divider */
  .hairline { background: var(--hairline); }
  .hairline-h { height: 1px; width: 100%; background: var(--hairline); }
  .hairline-v { width: 1px; height: 100%; background: var(--hairline); }

  /* Reveal mask wrapper for images
     NOTE: starts visible; the "in" class adds a soft scale-in for newly-seen plates.
     (Previous version started hidden via clip-path which combined with loading="lazy"
     to leave images permanently invisible when IntersectionObserver didn't fire.) */
  .reveal-img {
    position: relative; overflow: hidden;
  }
  .reveal-img > img,
  .reveal-img > .bg {
    transition: transform 900ms var(--ease);
    transform: scale(1.02);
  }
  .reveal-img.in > img,
  .reveal-img.in > .bg { transform: scale(1.0); }

  /* Tinted img */
  .tinted { filter: var(--img-filter); }

  /* Ken-burns slow */
  @keyframes ken {
    from { transform: scale(1.0); }
    to   { transform: scale(1.10); }
  }
  .ken { animation: ken 18s linear forwards; }

  /* Text fade-up */
  .fade-up { opacity: 0; transform: translateY(14px); transition: opacity 800ms var(--ease), transform 800ms var(--ease); }
  .fade-up.in { opacity: 1; transform: translateY(0); }

  /* Scroll indicator pulse */
  @keyframes pulseDown {
    0%, 100% { transform: translateY(0); opacity: .35; }
    50%      { transform: translateY(6px); opacity: .9; }
  }
  .scroll-ind { animation: pulseDown 2.4s ease-in-out infinite; }

  /* Selection */
  ::selection { background: var(--accent); color: var(--bg); }

  /* Reduce motion */
  @media (prefers-reduced-motion: reduce) {
    .reveal-img > img, .reveal-img > .bg { transform: none; transition: none; }
    .ken { animation: none; }
    .fade-up { opacity: 1; transform: none; transition: none; }
    .scroll-ind { animation: none; }
  }

  /* Tabular nums for indices */
  .num { font-variant-numeric: tabular-nums; }

  /* Section wrapper */
  section { position: relative; }

  /* Grid container */
  .container {
    width: 100%;
    max-width: 1440px;
    margin: 0 auto;
    padding-left: clamp(24px, 6vw, 120px);
    padding-right: clamp(24px, 6vw, 120px);
  }
  .container-wide {
    width: 100%;
    max-width: 1680px;
    margin: 0 auto;
    padding-left: clamp(24px, 4vw, 80px);
    padding-right: clamp(24px, 4vw, 80px);
  }

  /* Vertical section rhythm */
  .v-rhythm { padding-top: clamp(96px, 14vw, 200px); padding-bottom: clamp(96px, 14vw, 200px); }
  .v-rhythm-sm { padding-top: clamp(64px, 9vw, 140px); padding-bottom: clamp(64px, 9vw, 140px); }

  /* Hide scrollbar for ticker */
  .no-bar::-webkit-scrollbar { display: none; }
  .no-bar { scrollbar-width: none; }
</style>
